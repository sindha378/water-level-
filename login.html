
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Water Tank - Login</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0,0,0,.3);
        }

        .login-card h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .login-card input {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .login-card button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #0ea5e9;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #0284c7;
        }

        .switch-text {
            margin-top: 22px;
            text-align: center;
            color: #cbd5e1;
        }

        .switch-text a {
            color: #38bdf8;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="login-card">

        <h1>💧 Smart Water Tank</h1>
        <p class="subtitle" id="subtitle">
            Login to your account
        </p>

        <form id="authForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                autocomplete="name"
                hidden
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password (minimum 6 characters)"
                autocomplete="current-password"
                minlength="6"
                required
            >

            <button type="submit" id="submitBtn">
                Login
            </button>

        </form>

        <p class="switch-text">
            <span id="switchLabel">Don't have an account?</span>
            <a href="#" id="switchMode">Sign Up</a>
        </p>

        <p id="message" role="status" aria-live="polite"></p>

    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
